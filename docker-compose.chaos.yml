x-worker-common: &worker-common
  build: .
  command: ["python", "scripts/run_worker.py"]
  environment:
    TASK_QUEUE_BACKEND: redis
    REDIS_URL: redis://redis:6379/1
    DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
    EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
    BGE_MODEL_PATH: /app/models/bge-m3
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    SENTENCE_TRANSFORMERS_HOME: /app/models
    PYTHONUNBUFFERED: "1"
    TOKENIZERS_PARALLELISM: "false"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
    TORCH_NUM_THREADS: "1"
    TORCH_NUM_INTEROP_THREADS: "1"
    BGE_MODEL_DTYPE: ${BGE_MODEL_DTYPE:-float32}
  volumes:
    - ./models:/app/models:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - chaos_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: chaos_postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent123
      POSTGRES_DB: agent_platform
    ports:
      - "5433:5432"
    volumes:
      - chaos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaos_net

  redis:
    image: redis:7-alpine
    container_name: chaos_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaos_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-agent-platform:chaos
    container_name: chaos_api
    command: uvicorn src.agent_platform.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      DISABLE_AUTH: "true"
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
      BGE_MODEL_PATH: /app/models/bge-m3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
      TORCH_NUM_INTEROP_THREADS: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chaos_net

  worker-1:
    <<: *worker-common
    container_name: chaos_worker_1
    environment:
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
      BGE_MODEL_PATH: /app/models/bge-m3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
      TORCH_NUM_INTEROP_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      WORKER_ID: worker-1
      WORKER_PORT: "8001"
      BGE_MODEL_DTYPE: ${BGE_MODEL_DTYPE:-float32}

  worker-2:
    <<: *worker-common
    container_name: chaos_worker_2
    environment:
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
      BGE_MODEL_PATH: /app/models/bge-m3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
      TORCH_NUM_INTEROP_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      WORKER_ID: worker-2
      WORKER_PORT: "8002"
      BGE_MODEL_DTYPE: ${BGE_MODEL_DTYPE:-float32}


volumes:
  chaos_postgres_data:

networks:
  chaos_net:
    driver: bridge
