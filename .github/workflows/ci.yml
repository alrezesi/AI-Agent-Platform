name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agent_platform_test
        options: >-
          --health-cmd "pg_isready -U test -d agent_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client redis-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          python scripts/wait_for_services.py

      - name: Run unit tests
        run: |
          pytest tests/unit -q --junitxml=reports/unit.xml --cov=src/agent_platform --cov-report=xml:reports/coverage.xml --cov-report=html:htmlcov --tb=short
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run integration tests
        run: |
          pytest tests/integration -q --junitxml=reports/integration.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run concurrency tests
        run: |
          pytest tests/concurrency -q --junitxml=reports/concurrency.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run race tests
        run: |
          pytest tests/race -q --junitxml=reports/race.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run security tests
        run: |
          pytest tests/security -q --junitxml=reports/security.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run observability tests
        run: |
          pytest tests/observability -q --junitxml=reports/observability.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run e2e tests
        run: |
          pytest tests/e2e -q --junitxml=reports/e2e.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Run chaos tests
        run: |
          pytest tests/chaos -q --junitxml=reports/chaos.xml
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/agent_platform_test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            reports/coverage.xml
          retention-days: 30

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            reports/unit.xml
            reports/integration.xml
            reports/concurrency.xml
            reports/race.xml
            reports/security.xml
            reports/observability.xml
            reports/e2e.xml
            reports/chaos.xml
          retention-days: 30

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            reports/*.xml
            reports/*.err
            reports/*.out
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload benchmark/load-test results (placeholder for Phase 6)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            reports/benchmark*.json
            reports/loadtest*.json
            reports/performance*.json
          retention-days: 30
          if-no-files-found: ignore
