name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent123
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://agent:agent123@localhost:5432/agent_platform
      REDIS_URL: redis://localhost:6379/0
      TASK_QUEUE_BACKEND: redis
      DISABLE_AUTH: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src scripts

      - name: Unit tests
        run: pytest tests/unit -m "not integration and not e2e and not chaos" --cov=src/agent_platform --cov-report=xml --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration --cov-append --cov=src/agent_platform --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t ai-agent-platform:ci .

      - name: Start stack
        run: docker compose up -d --build postgres redis api worker-1 worker-2

      - name: E2E tests
        run: pytest tests/e2e tests/chaos/test_integration_e2e.py -m "e2e or chaos" --maxfail=1

      - name: Coverage gate
        run: python scripts/report_coverage.py --minimum 85

