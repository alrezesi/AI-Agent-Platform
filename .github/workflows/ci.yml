name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent123
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://agent:agent123@localhost:5432/agent_platform
      POSTGRES_URL: postgresql+asyncpg://agent:agent123@localhost:5432/agent_platform_test
      REDIS_HOST_PORT: 18379
      REDIS_URL: redis://localhost:6379/0
      TASK_QUEUE_BACKEND: redis
      DISABLE_AUTH: "true"
      PYTHONUNBUFFERED: "1"
      PRODUCTION_VERIFY_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src scripts

      - name: Unit tests
        run: pytest tests/unit -m "not integration and not e2e and not chaos" --junitxml=reports/unit.xml --cov=src/agent_platform --cov-report=xml --cov-report=term-missing

      - name: Integration tests
        run: pytest tests/integration --junitxml=reports/integration.xml --cov-append --cov=src/agent_platform --cov-report=term-missing
        env:
          TASK_QUEUE_BACKEND: memory

      - name: Build Docker image
        run: docker build -t ai-agent-platform:ci .

      - name: Start stack
        run: docker compose up -d postgres redis api worker-1 worker-2

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy within 60s"
          docker compose ps
          docker compose logs --no-color api --tail=100
          exit 1

      - name: Diagnose pre-E2E (compose state, worker logs, resource usage)
        if: always()
        run: |
          set +e
          mkdir -p reports/diag
          OUT=reports/diag/pre_e2e.txt
          {
            echo "=========== docker compose ps ==========="
            docker compose ps
            echo
            echo "=========== docker compose logs worker-1 worker-2 api postgres redis --tail=400 ==========="
            docker compose logs --no-color --tail=400 worker-1 worker-2 api postgres redis 2>&1
            echo
            echo "=========== docker stats --no-stream ==========="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}" 2>&1
            echo
            echo "=========== docker inspect workers (State / RestartCount / OOMKilled) ==========="
            for c in agent_platform_worker_1 agent_platform_worker_2 agent_platform_api; do
              echo "--- $c ---"
              docker inspect --format '{{.Name}} state={{.State.Status}} restartCount={{.RestartCount}} oomKilled={{.State.OOMKilled}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' "$c" 2>&1
            done
            echo
            echo "=========== Redis queue state ==========="
            docker exec agent_platform_redis redis-cli LLEN tasks:queue 2>&1
            docker exec agent_platform_redis redis-cli ZCARD tasks:queue 2>&1
            docker exec agent_platform_redis redis-cli ZCARD tasks:processing 2>&1
            docker exec agent_platform_redis redis-cli KEYS 'tasks:*' 2>&1
            echo
            echo "=========== Postgres tasks table snapshot ==========="
            docker exec agent_platform_postgres psql -U agent -d agent_platform -c "SELECT task_id, status, version, retry_count, lease_owner, lease_expires_at, started_at, completed_at, error FROM tasks ORDER BY created_at DESC LIMIT 10;" 2>&1
          } | tee "$OUT"

      - name: E2E tests
        env:
          RUN_DOCKER_E2E: "true"
          PRODUCTION_VERIFY_API_URL: http://127.0.0.1:8000
        run: pytest tests/e2e --junitxml=reports/e2e.xml -m e2e --maxfail=1

      - name: Diagnose post-E2E (state at timeout)
        if: always()
        run: |
          set +e
          mkdir -p reports/diag
          OUT=reports/diag/post_e2e.txt
          {
            echo "=========== POST-E2E docker compose ps ==========="
            docker compose ps
            echo
            echo "=========== POST-E2E docker compose logs worker-1 worker-2 api --tail=300 ==========="
            docker compose logs --no-color --tail=300 worker-1 worker-2 api 2>&1
            echo
            echo "=========== POST-E2E docker stats --no-stream ==========="
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>&1
            echo
            echo "=========== POST-E2E docker inspect workers ==========="
            for c in agent_platform_worker_1 agent_platform_worker_2 agent_platform_api; do
              echo "--- $c ---"
              docker inspect --format '{{.Name}} state={{.State.Status}} restartCount={{.RestartCount}} oomKilled={{.State.OOMKilled}} exitCode={{.State.ExitCode}}' "$c" 2>&1
            done
            echo
            echo "=========== POST-E2E Redis state ==========="
            docker exec agent_platform_redis redis-cli ZRANGE tasks:queue 0 -1 WITHSCORES 2>&1
            docker exec agent_platform_redis redis-cli ZRANGE tasks:processing 0 -1 WITHSCORES 2>&1
            echo
            echo "=========== POST-E2E Postgres tasks ==========="
            docker exec agent_platform_postgres psql -U agent -d agent_platform -c "SELECT task_id, status, version, retry_count, lease_owner, lease_expires_at, started_at, completed_at, error FROM tasks ORDER BY created_at DESC LIMIT 20;" 2>&1
          } | tee "$OUT"

      - name: Upload diagnostic evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostic-evidence
          path: reports/diag/
          if-no-files-found: warn

      - name: Publish diagnostic evidence to a public branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -e
          if [ ! -d reports/diag ] || [ -z "$(ls -A reports/diag 2>/dev/null)" ]; then
            echo "No diagnostic files to publish"
            exit 0
          fi
          BR="diag-evidence/run-${RUN_ID}-${RUN_ATTEMPT}"
          DEST_DIR="diag-evidence/run-${RUN_ID}-${RUN_ATTEMPT}"
          # Build the evidence tree in a fresh, empty git repo so we don't have
          # to wrestle with an unborn HEAD or the existing worktree state.
          WORK="$(mktemp -d)"
          git -C "$WORK" init -q -b main
          git -C "$WORK" config user.email "ci-bot@users.noreply.github.com"
          git -C "$WORK" config user.name "ci-bot"
          mkdir -p "$WORK/$DEST_DIR"
          cp -r reports/diag/. "$WORK/$DEST_DIR/"
          cat > "$WORK/$DEST_DIR/RUN_INFO.txt" <<EOF
          Run ${RUN_ID} attempt ${RUN_ATTEMPT}
          URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          git -C "$WORK" add -A
          git -C "$WORK" commit -q -m "diag(ci): capture evidence for run ${RUN_ID} attempt ${RUN_ATTEMPT}"
          git -C "$WORK" push --force origin "main:$BR"

      - name: Chaos verification tests
        env:
          RUN_DOCKER_CHAOS: "true"
          PRODUCTION_VERIFY_API_URL: http://127.0.0.1:8000
        run: pytest tests/chaos --junitxml=reports/chaos.xml -m chaos --maxfail=1

      - name: Concurrency tests
        run: pytest tests/concurrency --junitxml=reports/concurrency.xml --cov-append --cov=src/agent_platform --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Race tests
        run: pytest tests/race --junitxml=reports/race.xml --cov-append --cov=src/agent_platform --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Security tests
        run: pytest tests/security --junitxml=reports/security.xml --cov-append --cov=src/agent_platform --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Observability / distributed-trace tests
        run: pytest tests/observability --junitxml=reports/observability.xml --cov-append --cov=src/agent_platform --cov-report=term-missing
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Real load test
        run: python scripts/chaos_load_test.py --tasks 10000 --concurrency 500 --output load_test_results.json
        env:
          REDIS_URL: redis://localhost:18379/1

      - name: Coverage gate
        run: python scripts/report_coverage.py --minimum 85 --coverage-xml coverage.xml --unit-junit reports/unit.xml --integration-junit reports/integration.xml --e2e-junit reports/e2e.xml --chaos-junit reports/chaos.xml --concurrency-junit reports/concurrency.xml --race-junit reports/race.xml --security-junit reports/security.xml --observability-junit reports/observability.xml --load-json load_test_results.json --output CHAOS_TEST_REPORT.md
