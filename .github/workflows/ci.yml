name: CI

# ===========================================================================
# CI Workflow — AI-Agent-Platform
#
# Design decisions (see ENGINEERING_AUDIT.md for full traceability):
#
#   1.  Job-level env vars (POSTGRES_URL, REDIS_HOST_PORT, DATABASE_URL)
#       are the single source of truth — no step can forget to set them.
#       (Addendum 5 fix: previously the Unit-tests step lacked POSTGRES_URL
#       and defaulted to a wrong local-dev port 5433.)
#
#   2.  Services postgres uses POSTGRES_USER=agent / POSTGRES_DB=agent_platform
#       so the real FastAPI app and the e2e/chaos pytest suites (which boot a
#       real app instance via TestClient against DATABASE_URL) see the correct
#       schema.  The isolated test DB agent_platform_test is auto-created by
#       tests/conftest.py::ensure_test_db.
#
#   3.  The redis healthcheck uses REDIS_HOST_PORT (default 18379) so compose's
#       Redis never collides with the CI service Redis on 6379.
#       (Addendum 6 fix.)
#
#   4.  Coverage is accumulated with --cov-append across all test suites,
#       then combined with `coverage combine` and exported to
#       reports/coverage.xml for report_coverage.py.
#
#   5.  The --cov-fail-under=85 gate on every pytest step fails the job if
#       cumulative coverage drops below 85 %.
#
#   6.  report_coverage.py replaces the inline JavaScript-style string-built
#       report that previously hardcoded "Status: PASS".  It computes PASS
#       only when coverage >= 85 AND every JUnit suite has zero failures.
#
#   7.  The load-test job has NO if: always() — it only runs when the test
#       job passes.  (Previously load-test ran unconditionally, masking test
#       failures behind a green load-test result.)
#
#   8.  The load-test job runs both the bge-m3 and the noop benchmark.
#       noop measures raw pipeline capacity (no model cost), producing
#       separate output files per benchmark.
#
#   9.  The release-gate job is the final gate: it downloads all artifacts
#       from test + load-test and runs report_coverage.py one last time with
#       full data (JUnit + coverage + load-test JSON).  It must pass for the
#       pipeline to be green.
# ===========================================================================

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# ---------------------------------------------------------------------------
# Job-level environment — shared by every step that needs it.
# (Addendum 5: single source of truth for POSTGRES_URL / DATABASE_URL.)
# ---------------------------------------------------------------------------
env:
  DATABASE_URL: postgresql+asyncpg://agent:agent123@localhost:5432/agent_platform
  POSTGRES_URL: postgresql+asyncpg://agent:agent123@localhost:5432/agent_platform_test
  REDIS_HOST_PORT: 18379

jobs:
  # =========================================================================
  # TEST JOB — unit, integration, concurrency, race, security, observability,
  # e2e, chaos.  Accumulates coverage across all suites.
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - ${{ env.REDIS_HOST_PORT }}:6379
        options: >-
          --health-cmd "redis-cli -p \${{ env.REDIS_HOST_PORT }} ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent123
          POSTGRES_DB: agent_platform
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U agent -d agent_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client redis-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          python scripts/wait_for_services.py

      - name: Run database migrations
        run: |
          # Migrate the real agent_platform DB so e2e/chaos tests that boot a
          # real TestClient against DATABASE_URL see the full schema.
          # (Addendum 7 fix: previously this DB was never migrated in CI.)
          alembic -c alembic.ini upgrade head

      - name: Ensure isolated test DB exists
        run: |
          # ensure_test_db in conftest.py auto-creates agent_platform_test,
          # but we call it early so the first test step doesn't race.
          python -c "import asyncio; from tests.conftest import _ensure_database_exists, POSTGRES_URL; asyncio.run(_ensure_database_exists(POSTGRES_URL))"

      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/unit -q --junitxml=reports/unit.xml \
            --cov=src/agent_platform --cov-append --cov-report=term-missing \
            --cov-fail-under=85 2>&1 | tee reports/unit-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run integration tests
        run: |
          pytest tests/integration -q --junitxml=reports/integration.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/integration-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run concurrency tests
        run: |
          pytest tests/concurrency -q --junitxml=reports/concurrency.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/concurrency-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run race tests
        run: |
          pytest tests/race -q --junitxml=reports/race.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/race-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run security tests
        run: |
          pytest tests/security -q --junitxml=reports/security.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/security-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run observability tests
        run: |
          pytest tests/observability -q --junitxml=reports/observability.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/observability-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run e2e tests
        run: |
          pytest tests/e2e -q --junitxml=reports/e2e.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/e2e-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Run chaos tests
        run: |
          pytest tests/chaos -q --junitxml=reports/chaos.xml \
            --cov-append --cov-report=term-missing --cov-fail-under=85 2>&1 | tee reports/chaos-tests-output.txt
        env:
          REDIS_URL: redis://localhost:${{ env.REDIS_HOST_PORT }}/0

      - name: Combine coverage and generate XML
        run: |
          coverage combine
          coverage xml -o reports/coverage.xml
          coverage report > reports/coverage-summary.txt 2>&1

      - name: Upload coverage reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            reports/coverage.xml
            reports/coverage-summary.txt
          retention-days: 30

      - name: Upload JUnit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            reports/unit.xml
            reports/integration.xml
            reports/concurrency.xml
            reports/race.xml
            reports/security.xml
            reports/observability.xml
            reports/e2e.xml
            reports/chaos.xml
          retention-days: 30

      - name: Upload pytest output logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            reports/*.txt
          retention-days: 30
          if-no-files-found: ignore

  # =========================================================================
  # LOAD-TEST JOB — starts the real Docker stack and runs the chaos load
  # test with both bge-m3 and noop benchmarks.
  #
  # Key changes from the original ci.yml:
  #   • No if: always() — only runs when `test` passes.
  #   • BGE_MODEL_DTYPE=float16 (CI-only, Addendum 9) to fit host memory.
  #   • BGE_MAX_SEQ_LENGTH=128 (Addendum 10) to reduce per-worker RAM.
  #   • Two benchmarks: bge-m3 (3 runs) and noop (1 run).
  #   • Summary uses failure_rate (not the stale error_rate) and reads the
  #     new metrics schema fields (submitted, completed, successful, failed,
  #     timeout, pending, running, queue_remaining, drain_time, p50, p95, p99).
  # =========================================================================
  load-test:
    needs: test
    runs-on: ubuntu-latest
    # CI-only memory optimization: load BGE-M3 in float16 (~1 GB/worker vs
    # ~2 GB/worker in fp32) to stay within the 7 GB ubuntu-latest runner.
    # Local dev and production default to float32 (no behavior change).
    env:
      BGE_MODEL_DTYPE: float16
      BGE_MAX_SEQ_LENGTH: 128
      REDIS_HOST_PORT: 18379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install httpx redis asyncpg psycopg2-binary

      - name: Start Docker stack (2-worker topology from base compose)
        timeout-minutes: 8
        run: |
          docker compose -f docker-compose.yml up -d --build
          docker compose -f docker-compose.yml ps

      - name: Wait for services
        run: |
          python scripts/wait_for_services.py

      # --- bge-m3 benchmark: 3 runs at 10k tasks / 500 concurrency ---

      - name: Run load test - bge-m3 (Run 1, 10k tasks, 500 concurrency)
        timeout-minutes: 30
        run: |
          echo "Starting bge-m3 load test run 1..."
          DATABASE_URL="postgresql+asyncpg://agent:agent123@localhost:5433/agent_platform" \
          REDIS_URL="redis://localhost:${{ env.REDIS_HOST_PORT }}/1" \
          python scripts/chaos_load_test.py --tasks 10000 --concurrency 500 --benchmark bge-m3 --run-number 1 \
            2>&1 | tee reports/loadtest-run1.log

      - name: Clean data for bge-m3 Run 2
        run: |
          docker compose exec -T redis redis-cli -n 1 FLUSHDB
          docker compose exec -T postgres psql -U agent -d agent_platform -c "DELETE FROM tasks;"

      - name: Run load test - bge-m3 (Run 2, 10k tasks, 500 concurrency)
        timeout-minutes: 30
        run: |
          echo "Starting bge-m3 load test run 2..."
          DATABASE_URL="postgresql+asyncpg://agent:agent123@localhost:5433/agent_platform" \
          REDIS_URL="redis://localhost:${{ env.REDIS_HOST_PORT }}/1" \
          python scripts/chaos_load_test.py --tasks 10000 --concurrency 500 --benchmark bge-m3 --run-number 2 \
            2>&1 | tee reports/loadtest-run2.log

      - name: Clean data for bge-m3 Run 3
        run: |
          docker compose exec -T redis redis-cli -n 1 FLUSHDB
          docker compose exec -T postgres psql -U agent -d agent_platform -c "DELETE FROM tasks;"

      - name: Run load test - bge-m3 (Run 3, 10k tasks, 500 concurrency)
        timeout-minutes: 30
        run: |
          echo "Starting bge-m3 load test run 3..."
          DATABASE_URL="postgresql+asyncpg://agent:agent123@localhost:5433/agent_platform" \
          REDIS_URL="redis://localhost:${{ env.REDIS_HOST_PORT }}/1" \
          python scripts/chaos_load_test.py --tasks 10000 --concurrency 500 --benchmark bge-m3 --run-number 3 \
            2>&1 | tee reports/loadtest-run3.log

      # --- noop benchmark: 1 run (measures raw pipeline capacity, no model cost) ---

      - name: Clean data for noop benchmark
        run: |
          docker compose exec -T redis redis-cli -n 1 FLUSHDB
          docker compose exec -T postgres psql -U agent -d agent_platform -c "DELETE FROM tasks;"

      - name: Run load test - noop (10k tasks, 500 concurrency, no model cost)
        timeout-minutes: 15
        run: |
          echo "Starting noop load test run..."
          DATABASE_URL="postgresql+asyncpg://agent:agent123@localhost:5433/agent_platform" \
          REDIS_URL="redis://localhost:${{ env.REDIS_HOST_PORT }}/1" \
          python scripts/chaos_load_test.py --tasks 10000 --concurrency 500 --benchmark noop --run-number 1 \
            2>&1 | tee reports/loadtest-noop-run1.log

      - name: Generate load test summary
        run: |
          python scripts/load_test_summary.py

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: |
            reports/loadtest/
            reports/loadtest-run*.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop Docker stack
        if: always()
        run: |
          docker compose -f docker-compose.yml down --rmi all -v

  # =========================================================================
  # RELEASE-GATE JOB — final verification gate.
  #
  # Downloads all artifacts from test + load-test and runs report_coverage.py
  # with complete data (JUnit XMLs + coverage.xml + load-test JSON).
  # The script exits non-zero (FAIL) if coverage < 85% OR any JUnit suite
  # has failures/errors.  This job must pass for the pipeline to be green.
  # =========================================================================
  release-gate:
    needs: [test, load-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: reports/coverage-reports

      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          name: junit-reports
          path: reports/junit-reports

      - name: Download load test results
        uses: actions/download-artifact@v4
        with:
          name: loadtest-results
          path: reports/loadtest

      - name: Download pytest output logs
        uses: actions/download-artifact@v4
        with:
          name: pytest-output
          path: reports/pytest-output

      - name: Final coverage gate — report_coverage.py
        run: |
          echo "=== Final Coverage Gate ==="
          echo "This step runs report_coverage.py with ALL data (JUnit + coverage + load-test JSON)."
          echo "It exits non-zero (FAIL) if:"
          echo "  - coverage < 85%"
          echo "  - ANY JUnit suite has failures or errors"
          echo ""
          python scripts/report_coverage.py \
            --minimum 85 \
            --coverage-xml reports/coverage-reports/coverage.xml \
            --coverage-detail reports/coverage-reports/coverage-summary.txt \
            --unit-junit reports/junit-reports/unit.xml \
            --integration-junit reports/junit-reports/integration.xml \
            --e2e-junit reports/junit-reports/e2e.xml \
            --chaos-junit reports/junit-reports/chaos.xml \
            --concurrency-junit reports/junit-reports/concurrency.xml \
            --race-junit reports/junit-reports/race.xml \
            --security-junit reports/junit-reports/security.xml \
            --observability-junit reports/junit-reports/observability.xml \
            --load-json reports/loadtest/workload-bge-m3-run1.json \
            --output CHAOS_TEST_REPORT.md

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: |
            CHAOS_TEST_REPORT.md
          retention-days: 30
