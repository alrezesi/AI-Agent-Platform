services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_platform_postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent123
      POSTGRES_DB: agent_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    container_name: agent_platform_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-network

  api:
    build: .
    container_name: agent_platform_api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.agent_platform.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      DISABLE_AUTH: "true"
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - agent-network

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_platform_worker_1
    command: ["python", "scripts/run_worker.py"]
    environment:
      WORKER_ID: worker-1
      WORKER_PORT: "8001"
      PYTHONUNBUFFERED: "1"
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
      BGE_MODEL_PATH: /app/models/bge-m3
      GEMMA_MODEL_PATH: /app/models/gemma-2-2b-it
      PERSIANPHI_MODEL_PATH: /app/models/PersianPhi
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
    volumes:
      - "./models:/app/models"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-network

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_platform_worker_2
    command: ["python", "scripts/run_worker.py"]
    environment:
      WORKER_ID: worker-2
      WORKER_PORT: "8002"
      PYTHONUNBUFFERED: "1"
      TASK_QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgresql://agent:agent123@postgres:5432/agent_platform
      EXECUTION_COUNTER_REDIS_URL: redis://redis:6379/1
      BGE_MODEL_PATH: /app/models/bge-m3
      GEMMA_MODEL_PATH: /app/models/gemma-2-2b-it
      PERSIANPHI_MODEL_PATH: /app/models/PersianPhi
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SENTENCE_TRANSFORMERS_HOME: /app/models
    volumes:
      - "./models:/app/models"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-network

volumes:
  postgres_data:

networks:
  agent-network:
    driver: bridge
